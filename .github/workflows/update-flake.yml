name: Update Flake

on:
  schedule:
    # 07:00 EDT / 06:00 EST (GitHub cron is UTC); consumers (juspay/AI) run one hour later.
    - cron: '0 11 * * *'
  workflow_dispatch:

# Runs share the update branch and pull request, so they must not overlap.
concurrency: update-flake

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Approve the runs this job's pull request is waiting on.
      actions: write
    outputs:
      pr: ${{ steps.update.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Read the pinned package versions
        id: versions-before
        run: bash .github/scripts/read-versions.sh

      - name: Advance the oh-my-pi release pin
        id: omp
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/advance-omp-pin.sh

      - name: Update all inputs
        id: lock
        shell: bash
        run: |
          nix flake update --log-format raw 2>&1 | tee "$RUNNER_TEMP/flake-update.log"
          bash .github/scripts/read-versions.sh

      - name: Update the test lock after the root lock
        run: bash test/update-lock.sh

      - name: Describe the locked versions
        id: report
        env:
          OMP_BEFORE: ${{ steps.omp.outputs.before }}
          OMP_AFTER: ${{ steps.omp.outputs.after }}
          OMP_LATEST: ${{ steps.omp.outputs.latest }}
          CODEX_BEFORE: ${{ steps.versions-before.outputs.codex-version }}
          CODEX_AFTER: ${{ steps.lock.outputs.codex-version }}
          CLAUDE_BEFORE: ${{ steps.versions-before.outputs.claude-version }}
          CLAUDE_AFTER: ${{ steps.lock.outputs.claude-version }}
        run: python3 .github/scripts/describe-flake-update.py

      - uses: peter-evans/create-pull-request@v8
        id: update
        with:
          branch: flake-update
          delete-branch: true
          add-paths: |
            flake.nix
            flake.lock
            test/flake.lock
          title: ${{ steps.report.outputs.pr-title }}
          body-path: ${{ steps.report.outputs.pr-body-path }}
          commit-message: "chore(flake): update inputs"
          labels: dependencies

      # A pull request that GITHUB_TOKEN opens leaves its workflow runs waiting
      # for a maintainer to approve them, and quiet wording in the checks UI
      # hides that they never ran. This job created the pull request and gates
      # the merge on its own CI, so it approves those runs itself instead of
      # asking a maintainer to start the same builds every morning. What the
      # runs then prove is unchanged: the required `build (ubuntu-latest)` and
      # `build (macos-latest)` checks are the contexts `Require CI on main`
      # expects, and they now report on the commit the pull request merges.
      - name: Approve the runs the update pull request is waiting on
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.update.outputs.pull-request-number }}
        run: |
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          approved=0
          for _ in $(seq 20); do
            pending=$(gh run list --commit "$sha" --limit 50 --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "action_required" or .conclusion == "action_required")
                     | .databaseId] | join(" ")')
            if [ -n "$pending" ]; then
              for run in $pending; do
                echo "Approving run $run"
                gh api -X POST "repos/$GH_REPO/actions/runs/$run/approve" >/dev/null
              done
              approved=$((approved + 1))
            elif [ "$approved" -gt 0 ]; then
              break
            fi
            sleep 10
          done

  # Merge the update only after the shared CI the ruleset requires succeeds.
  merge:
    needs: update
    if: needs.update.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for the pull request checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout 2h gh pr checks "${{ needs.update.outputs.pr }}" --watch --fail-fast --interval 30

      - name: Merge the flake bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --squash --delete-branch "${{ needs.update.outputs.pr }}"
