# Builds the website (./doc) and publishes it to GitHub Pages.
# The custom domain is set in the repository's Pages settings.
name: Pages

on:
  # Pages serves one site, built from main. A docs change on a PR branch is
  # checked by odu's `site` recipe; the `github-pages` environment only
  # deploys main, so other branches would just fail the deploy.
  push:
    branches: [main]
    paths:
      - "doc/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-substituters = https://cache.kolu.dev/kolu-r2
            extra-trusted-public-keys = kolu-r2-1:7KmFrK05rVrnxkyZi9hJGnJJmRCpg87u6MUQIk7nokQ=

      - run: nix build ./doc -L -o ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # `doc/site.nix` writes `.nojekyll`, and from v4 this action drops
          # dotfiles unless asked: without it Pages runs the site through
          # Jekyll, which is the one thing that file exists to prevent.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
