name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The daily update dispatches this workflow on its branch: the run's checks
  # (`build (ubuntu-latest)`, `build (macos-latest)`) are the contexts main's
  # ruleset requires, and they must report on the commit that lands on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-darwin), matching the flake's supported
        # systems; ubuntu-latest covers x86_64-linux and ubuntu-24.04-arm
        # aarch64-linux, so every supported system reaches the cache.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      PUSH_CACHE: >-
        ${{
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test flake update policy and reporting
        if: runner.os == 'Linux'
        run: python3 .github/scripts/test-update-flake.py

      # A harness that misses the cache builds from source (omp and opencode
      # together leave ~17 GB in the store), and the VM tests then need room
      # for their images. The hosted Linux image's unused SDKs make that room;
      # without it the runner fills its disk and the job dies with no log.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}
          # Trust the project cache so builds pull from it (warms nix run /
          # nix develop on both platforms) instead of rebuilding.
          extra_nix_config: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - name: Check the cache config matches lib/cache.nix
        run: python3 .github/scripts/check-cache-config.py

      - name: Require cache token
        if: env.PUSH_CACHE == 'true'
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "::error::ATTIC_TOKEN must be set to push builds to the OSS cache."
            exit 1
          fi

      # The cache lets users and CI fetch source-built harnesses,
      # so a missing token is an error, not a skip.
      - uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        if: env.PUSH_CACHE == 'true'
        with:
          endpoint: https://cache.nixos.asia
          cache: oss
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build all flake outputs
        run: |
          nix build github:srid/devour-flake -L --no-link \
            --override-input flake .

      - name: Build the profile menu
        # The menu depends on every profile's launchers, so this builds them all.
        run: |
          nix build --print-build-logs .#default

      - name: Wrapper package tests
        # The wrapper tests boot NixOS VMs (x86_64-linux only: the test flake
        # fixes its system, and ARM runners have no KVM). `nix flake check`
        # builds the whole checks set.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          cd test && nix flake check -L

      - name: Test the distribution template
        run: bash test/template.sh
