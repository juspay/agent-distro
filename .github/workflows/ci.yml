name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The daily update dispatches this workflow on its branch: the run's checks
  # (`build (ubuntu-latest)`, `build (macos-latest)`) are the contexts main's
  # ruleset requires, and they must report on the commit that lands on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Shared by the build and the VM shards: both push what they build.
env:
  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
  PUSH_CACHE: >-
    ${{
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-darwin), matching the flake's supported
        # systems; ubuntu-latest covers x86_64-linux and ubuntu-24.04-arm
        # aarch64-linux, so every supported system reaches the cache.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # This job pushes the content-addressed index, a branch of this repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test the update and index scripts
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/test-update-flake.py
          python3 .github/scripts/test-ca-index.py

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}
          # Trust the project cache so builds pull from it (warms nix run /
          # nix develop on both platforms) instead of rebuilding.
          extra_nix_config: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - name: Check the cache config matches lib/cache.nix
        run: python3 .github/scripts/check-cache-config.py

      - name: Require cache token
        if: env.PUSH_CACHE == 'true'
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "::error::ATTIC_TOKEN must be set to push builds to the OSS cache."
            exit 1
          fi

      # The cache lets users and CI fetch source-built harnesses,
      # so a missing token is an error, not a skip.
      - uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        if: env.PUSH_CACHE == 'true'
        with:
          endpoint: https://cache.nixos.asia
          cache: oss
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build all flake outputs
        run: |
          nix build github:srid/devour-flake -L --no-link \
            --override-input flake .

      - name: Build the picker
        # The picker depends on every launcher, so this builds them all.
        run: |
          nix build --print-build-logs .#default

      # A user whose nix will not honour the cache cannot fetch an
      # input-addressed bundle from it at all: their own substituters, key and
      # --no-check-sigs are all dropped (nix.conf `require-sigs`). A
      # content-addressed path is trusted by itself, so publish the rewritten
      # closure and the index that names it together — the attic-action below
      # pushes the rewritten paths along with the rest of the job's store
      # additions, and the updater reads the index to find them.
      - name: Publish the content-addressed bundles
        if: env.PUSH_CACHE == 'true'
        env:
          REV: ${{ github.sha }}
          INDEX: ${{ runner.temp }}/ca-index
          # `latest/` names the newest bundle a system published, so only a
          # push to main moves it: a pull request's run would point consumers
          # at a commit that never lands.
          LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -eu
          args=(--rev "$REV" --system "$(nix config show system)" --directory "$INDEX")
          if [ "$LATEST" = "true" ]; then
            args+=(--latest)
          fi
          installables=()
          for directory in profiles/*/; do installables+=(".#$(basename "$directory")"); done
          python3 .github/scripts/ca-index.py "${args[@]}" "${installables[@]}"

      - name: Run a launcher out of a content-addressed bundle
        # The rewrite replaces the store paths embedded in every file, which
        # for a Mach-O also invalidates its ad-hoc signature; arm64 macOS then
        # kills the binary on exec. Running one launcher from the rewritten
        # bundle is the only way to know a user can still run it, and comparing
        # the bytes of what ran is what says whether the rewrite reached it.
        if: env.PUSH_CACHE == 'true'
        env:
          REV: ${{ github.sha }}
          INDEX: ${{ runner.temp }}/ca-index
        run: |
          set -eu
          entry="$INDEX/$REV/$(nix config show system)/vanilla.json"
          where() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$entry" "$1"; }
          bundle=$(where ca)
          echo "content-addressed bundle: $bundle (from $(where ia))"
          # The launcher is a script: its shebang names the binary that runs
          # first, and a store path embedded in a file is what the rewrite
          # replaces.
          interpreter() { sed -n '1s/^#!//p' "$1/bin/claude" | awk '{print $1}'; }
          before=$(interpreter "$(where ia)")
          after=$(interpreter "$bundle")
          echo "launcher interpreter: $before -> $after"
          if cmp -s "$before" "$after"; then
            echo "the rewrite left the interpreter's bytes alone"
          else
            echo "the rewrite rewrote the interpreter: $(cmp -l "$before" "$after" 2>/dev/null | wc -l) bytes differ"
          fi
          "$bundle/bin/claude" --version

      - name: Push the content-addressed index
        # Every system's entries are disjoint files under its own directory
        # (`<rev>/<system>/…`, and `latest/<system>/…` where a main push wrote
        # one), so a run that pushed meanwhile is rebased under this one rather
        # than contested; the branch is created by whichever system gets there
        # first.
        #
        # Only outside a pull request: `github.sha` there is the merge commit
        # GitHub made for the run, which no updater can lock — entries for it
        # would be read by nobody, forever. The rewrite and the launcher run on
        # pull requests all the same; only this push waits for a commit that
        # lands on a branch.
        if: env.PUSH_CACHE == 'true' && github.event_name != 'pull_request'
        env:
          REV: ${{ github.sha }}
          INDEX: ${{ runner.temp }}/ca-index
        run: |
          set -eu
          branch=ca-index
          # This checkout is shallow and detached; the branch is written with
          # plumbing from the index tree alone, so nothing here touches the
          # repository's own work tree or its commits.
          export GIT_DIR="$(cd "$(git rev-parse --git-dir)" && pwd)"
          export GIT_WORK_TREE="$INDEX"
          export GIT_INDEX_FILE="$GIT_DIR/$branch.index"
          cd "$INDEX"
          for attempt in $(seq 10); do
            if git fetch --quiet --depth=1 origin "$branch" 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree "$parent"
            else
              parent=
              git read-tree --empty
            fi
            # What this run published, keeping whatever the branch held
            # already: an entry for another system is not this run's to drop.
            git add --ignore-removal .
            tree=$(git write-tree)
            commit=$(git -c user.name='github-actions[bot]' \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit-tree "$tree" ${parent:+-p "$parent"} -m "chore(ca-index): bundles built from $REV")
            if git push --quiet origin "$commit:refs/heads/$branch"; then
              echo "ca-index: pushed $commit"
              exit 0
            fi
            echo "ca-index: the branch moved; retrying on its new tip (attempt $attempt)"
            sleep 2
          done
          echo "::error::cannot push the $branch branch"
          exit 1

      - name: Build the website
        # The site is the same on every system, so one runner builds it; a
        # broken site fails the PR.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: nix build ./doc --no-link -L

      - name: Test the distribution template
        run: bash test/template.sh

  # The wrapper tests boot NixOS VMs (x86_64-linux only: the test flake fixes
  # its system, and ARM runners have no KVM). One runner fits only two VMs at a
  # time, so the checks are split round-robin across shards that run in
  # parallel; the list is read from the flake, so a new check needs no edit.
  test-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Split the checks into shards
        id: plan
        run: |
          names=$(cd test && nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          shards=$(jq -c --argjson n 8 '
            [range($n) as $s
              | [to_entries[] | select(.key % $n == $s) | ".#checks.x86_64-linux.\(.value)"]
              | join(" ")]' <<<"$names")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  test:
    # After the x86_64-linux build has pushed the launchers to the cache, so
    # the shards fetch them instead of each building them again.
    needs: [build, test-plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        if: env.PUSH_CACHE == 'true'
        with:
          endpoint: https://cache.nixos.asia
          cache: oss
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Wrapper package tests
        # Two VMs at a time: four saturate the hosted runner's four vCPUs, and
        # GitHub then cancels the step midway with no error whenever the checks
        # miss the cache.
        run: |
          cd test && nix build -L --no-link --max-jobs 2 ${{ matrix.shard }}

  # One fixed context for the ruleset to require, whatever the shard names.
  tests:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        run: |
          if [ "${{ needs.test.result }}" != success ]; then
            echo "::error::A wrapper test shard did not pass (${{ needs.test.result }})."
            exit 1
          fi
